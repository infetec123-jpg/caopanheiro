<style>
/* ============ RESET & VARIÁVEIS ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F3FAF7;
  --bg-alt:#E5F3ED;
  --bg-card:#FFFFFF;
  --bg-elevated:#D9EEE6;
  --accent:#83CDB8;
  --accent-2:#B9E5D8;
  --accent-glow:rgba(131, 205, 184, .28);
  --text:#34564C;
  --text-muted:#58766C;
  --border:#C5E3D8;
  --white:#ffffff;
  --font-head:'Oswald',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --radius:14px;
  --shadow:0 8px 30px rgba(54, 104, 86, .12);
  --transition:.3s cubic-bezier(.4,0,.2,1);
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img,svg{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
ul{list-style:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ============ LAYOUT ============ */
.container{width:min(1200px,92%);margin-inline:auto}
.section{padding:80px 0}
.section-header{text-align:center;max-width:680px;margin:0 auto 56px}
.section-tag{
  display:inline-block;
  font-family:var(--font-head);
  font-size:.8rem;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:12px;
}
.section-title{
  font-family:var(--font-head);
  font-size:clamp(1.8rem,4vw,2.6rem);
  font-weight:700;
  line-height:1.15;
  margin-bottom:14px;
}
.section-desc{color:var(--text-muted);font-size:1.02rem}

/* ============ HEADER / MENU ============ */
.header{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  background:rgba(243,250,247,.92);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(197,227,216,.8);
  transition:var(--transition);
}
.header.scrolled{background:rgba(243,250,247,.98);box-shadow:0 4px 20px rgba(54,104,86,.10)}
.nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0;gap:20px;
}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-size:1.35rem;font-weight:700;letter-spacing:.5px}
.logo-mark{
  width:36px;height:36px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-radius:10px;
  display:grid;place-items:center;
  color:#fff;font-size:1.1rem;
  box-shadow:0 0 20px var(--accent-glow);
}
.logo span{color:var(--accent)}
.nav-links{display:none}
.nav-links a{
  font-size:.95rem;font-weight:500;color:var(--text-muted);
  position:relative;transition:color var(--transition);
}
.nav-links a:hover{color:var(--white)}
.nav-links a::after{
  content:'';position:absolute;bottom:-6px;left:0;
  width:0;height:2px;background:var(--accent);
  transition:width var(--transition);
}
.nav-links a:hover::after{width:100%}
.nav-cta{display:none}
.menu-toggle{
  width:44px;height:44px;display:grid;place-items:center;
  border:1px solid var(--border);border-radius:10px;
}
.menu-toggle span{display:block;width:20px;height:2px;background:var(--text);position:relative;transition:var(--transition)}
.menu-toggle span::before,.menu-toggle span::after{
  content:'';position:absolute;left:0;width:20px;height:2px;background:var(--text);transition:var(--transition);
}
.menu-toggle span::before{top:-6px}
.menu-toggle span::after{top:6px}
.menu-toggle.active span{background:transparent}
.menu-toggle.active span::before{top:0;transform:rotate(45deg);background:var(--accent)}
.menu-toggle.active span::after{top:0;transform:rotate(-45deg);background:var(--accent)}

/* Menu mobile */
.mobile-menu{
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;
  background:var(--bg);padding:100px 24px 40px;
  display:flex;flex-direction:column;gap:8px;
  transform:translateX(100%);
  transition:transform .4s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;
}
.mobile-menu.active{transform:translateX(0)}
.mobile-menu a{
  font-family:var(--font-head);font-size:1.4rem;font-weight:600;
  padding:16px 0;border-bottom:1px solid var(--border);
  color:var(--text);display:flex;justify-content:space-between;align-items:center;
}
.mobile-menu a:hover{color:var(--accent)}
.mobile-menu .btn-whats{margin-top:24px;justify-content:center;font-family:var(--font-body);font-size:1rem}

/* ============ BOTÕES ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:14px 26px;border-radius:12px;
  font-weight:600;font-size:.98rem;
  transition:var(--transition);white-space:nowrap;
}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;box-shadow:0 6px 20px var(--accent-glow);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px var(--accent-glow)}
.btn-ghost{
  background:transparent;color:var(--text);border:1.5px solid var(--border);
}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

/* ============ HERO ============ */
.hero{
  position:relative;min-height:100svh;
  display:flex;align-items:center;
  padding:120px 0 80px;overflow:hidden;
  background:
    radial-gradient(ellipse 60% 50% at 80% 20%,rgba(131,205,184,.18),transparent 60%),
    radial-gradient(ellipse 50% 60% at 10% 80%,rgba(185,229,216,.22),transparent 60%),
    var(--bg);
}
.hero::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(131,173,156,.18) 1px,transparent 1px),
    linear-gradient(90deg,rgba(131,173,156,.18) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);
  pointer-events:none;
}
.hero-content{position:relative;z-index:2;max-width:820px}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:100px;
  background:rgba(131,205,184,.20);
  border:1px solid rgba(131,205,184,.45);
  color:var(--accent-2);font-size:.85rem;font-weight:600;
  margin-bottom:24px;
}
.hero-badge .dot{
  width:8px;height:8px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 10px var(--accent);animation:pulse 2s infinite;
}
@keyframes pulse{50%{opacity:.4;transform:scale(.85)}}
.hero h1{
  font-family:var(--font-head);
  font-size:clamp(2.2rem,6vw,4.2rem);
  font-weight:700;line-height:1.05;
  letter-spacing:-.5px;margin-bottom:20px;
}
.hero h1 .highlight{
  color:var(--accent);position:relative;display:inline-block;
}
.hero p{
  font-size:clamp(1rem,2vw,1.2rem);
  color:var(--text-muted);max-width:620px;margin-bottom:36px;
}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:48px}
.hero-trust{
  display:grid;grid-template-columns:repeat(2,1fr);gap:20px;
  padding-top:32px;border-top:1px solid var(--border);
}
